minimumLimaVersion: 2.0.0

images:
- location: https://cdn.amazonlinux.com/al2023/os-images/2023.12.20261102.0/kvm-arm64/al2023-kvm-2023.12.20261102.0-kernel-6.1-arm64.xfs.gpt.qcow2
  arch: aarch64
  digest: sha256:931e1a07050b52abf90a52e0fd7eee951f79672d6214f218a707e212fd96d717

provision:
- mode: system
  script: |
    #!/bin/sh
    set -eu
    sed -i '/^lima-[0-9a-f]* .* virtiofs /d' /etc/fstab
    sed -n 's/^- \[\(lima-[0-9a-f]*\), \(.*\), virtiofs, "\([^"]*\)", "0", "0"\]$/\1 \2 virtiofs \3 0 0/p' \
        /mnt/lima-cidata/user-data >> /etc/fstab
    awk '$3 == "virtiofs" && $1 ~ /^lima-/ {print $2}' /etc/fstab | xargs -r mkdir -p
    systemctl daemon-reload
    mount -a -t virtiofs

base:
- template:_default/mounts
