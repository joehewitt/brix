<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yumi Source Inspector</title>
<style>{{DEMO_CSS}}</style>
</head>
<body>
<header class="toolbar">
<div>
<h1>Yumi Source Inspector</h1>
<p>Five files across the standard library and examples</p>
</div>
<label>Theme<select id="theme-select" aria-label="Syntax theme"></select></label>
</header>
<main class="workspace">
<section class="source-pane" aria-label="Yumi source">{{YUMI_SOURCE_FRAGMENT}}</section>
<aside class="inspector" aria-live="polite">
<div class="inspector-heading">
<span>AST context</span>
<strong id="specific-node">No selection</strong>
</div>
<div id="node-stack" class="node-stack"></div>
</aside>
</main>
<script>{{DEMO_JS}}</script>
</body>
</html>
